    <script>
    (function() {
        const e = document.getElementById('e_d7451aa0');
        const m = document.getElementById('m_d7451aa0');
        let drag = false, x = 15, y = 5, sx, sy;
        
        e.addEventListener('mousedown', (ev) => { 
            drag = true; 
            sx = ev.clientX; 
            sy = ev.clientY; 
            e.style.cursor = 'grabbing'; 
            ev.preventDefault(); 
        });
        
        document.addEventListener('mouseup', () => { 
            if(drag) {
                drag = false; 
                e.style.cursor = 'grab'; 
            }

        document.addEventListener('mousemove', (ev) => {

            x += (ev.clientX - sx) * 0.6;

            sx = ev.clientX; 
            sy = ev.clientY;
        });
    })();
