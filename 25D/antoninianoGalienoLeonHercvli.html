    <script>
    (function() {
        const e = document.getElementById('e_b4cd3d49');
        const m = document.getElementById('m_b4cd3d49');
        let drag = false, x = 15, y = 5, sx, sy;
        
        e.addEventListener('mousedown', (ev) => { 
            drag = true; 
            sx = ev.clientX; 
            sy = ev.clientY; 
            e.style.cursor = 'grabbing'; 
            ev.preventDefault(); 
        });
        
        document.addEventListener('mouseup', () => { 
            if(drag) {
                drag = false; 
                e.style.cursor = 'grab'; 
            }
        });
        
        document.addEventListener('mousemove', (ev) => {
            if(!drag) return;
            x += (ev.clientX - sx) * 0.6; 
            y -= (ev.clientY - sy) * 0.4;
            y = Math.max(-40, Math.min(40, y));
            m.style.transform = `rotateX(${y}deg) rotateY(${x}deg)`;
            sx = ev.clientX; 
            sy = ev.clientY;
        });
    })();
    </script>
