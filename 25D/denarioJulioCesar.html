    <script>

        const m = document.getElementById('m_d17dcfe7');
        let drag = false, x = 15, y = 5, sx, sy;
        
        e.addEventListener('mousedown', (ev) => { 
            drag = true; 
            sx = ev.clientX; 
            sy = ev.clientY; 
            e.style.cursor = 'grabbing'; 
            ev.preventDefault(); 
        });
        
        document.addEventListener('mouseup', () => { 
            if(drag) {
                drag = false; 
                e.style.cursor = 'grab'; 
            }
        });
        
        document.addEventListener('mousemove', (ev) => {

            x += (ev.clientX - sx) * 0.6;

            sy = ev.clientY;
        });
    })();
